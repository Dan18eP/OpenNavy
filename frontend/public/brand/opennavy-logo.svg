<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%">
  <defs>
    <!-- Gradiente Vela Terminal (Amarillo Dorado MLH) -->
    <linearGradient id="sailYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE042" />
      <stop offset="100%" stop-color="#FFC72C" />
    </linearGradient>

    <!-- Gradiente Proa / Casco Naval (Azul Eléctrico a Deep Navy MLH) -->
    <linearGradient id="hullBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0084C7" />
      <stop offset="100%" stop-color="#192531" />
    </linearGradient>

    <!-- Sombra suave para dar volumen sobre blanco -->
    <filter id="navGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#192531" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- ================= ISOTIPO (HEXÁGONO + EMBARCACIÓN TRICOLOR) ================= -->
  <g transform="translate(15, 10)" filter="url(#navGlow)">
    <!-- Contenedor Hexagonal en Azul Sutil -->
    <path d="M 32 14 L 12 26 L 12 74 L 50 96 L 88 74 L 88 26 L 68 14" fill="none" stroke="#CBD5E1" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Línea de red naval (Deep Navy) -->
    <path d="M 28 83 L 50 96 L 72 83" fill="none" stroke="#192531" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Vela Terminal '>' (Amarillo Dorado MLH) -->
    <path d="M 30 36 L 48 50 L 30 64" fill="none" stroke="url(#sailYellow)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Vela Proa (Azul Eléctrico MLH) -->
    <path d="M 56 24 L 74 64 L 56 64 Z" fill="url(#hullBlue)" />

    <!-- Quilla / Base de Terminal (Rojo MLH) -->
    <line x1="34" y1="74" x2="74" y2="74" stroke="#E73427" stroke-width="6" stroke-linecap="round" />

    <!-- Indicador de Navegación Activa (Dorado MLH) -->
    <circle cx="50" cy="14" r="4.5" fill="#FFC72C" stroke="#192531" stroke-width="1.5" />
  </g>

  <!-- ================= LOGOTIPO / TIPOGRAFÍA ================= -->
  <g transform="translate(130, 0)">
    <!-- Indicador de ruta náutica local -->
    <text x="0" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0084C7" font-weight="700">
      ~/sovereign/fleet/
    </text>

    <!-- Nombre de la Flota -->
    <text x="0" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="44" letter-spacing="-1">
      <tspan fill="#192531" font-weight="800">Open</tspan><tspan fill="#E73427" font-weight="700">Navy</tspan>
    </text>
  </g>
</svg>