<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 130" width="100%" height="100%">
  <defs>
    <!-- Gradiente Vela Principal (Turquesa a Azul) -->
    <linearGradient id="sailMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Gradiente Casco / Vela Secundaria -->
    <linearGradient id="hullBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Sombra suave para dar profundidad -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Fondo general (Opcional: puedes borrar este <rect> si quieres fondo transparente) -->
  <rect width="460" height="130" rx="16" fill="#0B0F19" />

  <!-- ================= ISOTIPO (HEXÁGONO + BARCO TERMINAL) ================= -->
  <g transform="translate(25, 15)" filter="url(#glow)">
    
    <!-- Hexágono Exterior Abierto ("Open Container") -->
    <path d="M 32 14 L 12 26 L 12 74 L 50 96 L 88 74 L 88 26 L 68 14" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Línea de red / Puerto activo (Borde inferior iluminado) -->
    <path d="M 28 83 L 50 96 L 72 83" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Símbolo Terminal '>' formando la Vela Izquierda (Ejecución Local) -->
    <path d="M 30 36 L 48 50 L 30 64" fill="none" stroke="url(#sailMain)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Vela Derecha / Proa del Barco (Geometría Naval) -->
    <path d="M 56 24 L 74 64 L 56 64 Z" fill="url(#hullBlue)" />

    <!-- Quilla / Base del barco (Guion bajo de terminal '_') -->
    <line x1="36" y1="74" x2="72" y2="74" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round" />

    <!-- Punto de estado "Online / Localhost" -->
    <circle cx="50" cy="14" r="4" fill="#34D399" />
  </g>

  <!-- ================= LOGOTIPO (TIPOGRAFÍA) ================= -->
  <g transform="translate(140, 0)">
    <!-- Indicador de ruta local estilo Linux/Mac -->
    <text x="0" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#34D399" font-weight="600">
      ~/localhost/
    </text>

    <!-- Nombre de la plataforma -->
    <text x="0" y="88" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="44" letter-spacing="-1">
      <tspan fill="#F8FAFC" font-weight="700">Open</tspan><tspan fill="#38BDF8" font-weight="300">Navy</tspan>
    </text>

    <!-- Badge "OSS" (Open Source Software) -->
    <rect x="218" y="60" width="42" height="20" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="239" y="74" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#94A3B8" font-weight="700" text-anchor="middle">
      OSS
    </text>
  </g>
</svg>